name: Record fight voices
on:
  push:
    branches: [main]
    paths: [index.html, tools/voice-lines.cjs, tools/make-voices.py, .github/workflows/voices.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voices
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts==7.2.8
      - run: node tools/voice-lines.cjs
      - run: python tools/make-voices.py
      - name: Save the recordings
        run: |
          git config user.name "spice-souk voices"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voices
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Record fight voices"
          git pull --rebase origin main
          git push origin HEAD:main
